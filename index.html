<!doctype html>
<html lang="en" class="app-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aetheria</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0c0b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Fantasy idle RPG: 21 skills, combat, bosses, quests, a tavern full of staff and offline progress." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aetheria · Idle RPG" />
    <meta property="og:description" content="Fantasy idle RPG: 21 skills, combat, bosses, quests, a tavern full of staff and offline progress." />
    <meta property="og:url" content="https://heavenly3.github.io/Aetheria/" />
    <meta property="og:image" content="https://heavenly3.github.io/Aetheria/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The fonts load in the background, so a slow connection does not keep the screen blank -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" /></noscript>
    <style>
      /* Shown at once while the game downloads; Vue replaces it when it starts */
      html { background: #0c0b14; }
      @media (prefers-color-scheme: light) { html:not(.app-dark) { background: #f3ede1; } }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; font-family: Georgia, 'Times New Roman', serif; color: #e2b65a; background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(226, 182, 90, 0.12), transparent 70%), #0c0b14; }
      .boot-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .boot-mark { width: 64px; height: 64px; border-radius: 22%; background: linear-gradient(135deg, #f8e3a8, #e2b65a 45%, #a87a2a); box-shadow: 0 0 50px -6px rgba(226, 182, 90, 0.7); display: grid; place-items: center; color: #1a1206; font-size: 34px; }
      .boot-name { font-size: 40px; letter-spacing: 0.18em; text-transform: uppercase; }
      .boot-bar { width: 160px; height: 3px; border-radius: 3px; background: rgba(226, 182, 90, 0.18); overflow: hidden; }
      .boot-bar i { display: block; width: 40%; height: 100%; background: #e2b65a; border-radius: 3px; animation: boot 1.2s ease-in-out infinite; }
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar i { animation: none; width: 100%; opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot" role="status" aria-label="Loading Aetheria"><div class="boot-inner"><div class="boot-mark" aria-hidden="true">&#9813;</div><div class="boot-name">Aetheria</div><div class="boot-bar"><i></i></div></div></div></div>
    <script>
      // If the game has not started after a long while (a file that failed to download), offer a reload
      setTimeout(function () {
        var inner = document.querySelector('.boot[role=status] .boot-inner')
        if (!inner) return
        var es = /^es/.test(navigator.language)
        var p = document.createElement('p')
        p.style.cssText = 'margin:0;font:14px system-ui,sans-serif;color:#cfc8b8;text-align:center'
        p.innerHTML = (es ? 'Está tardando más de lo normal. ' : 'This is taking longer than usual. ') + '<a href="" style="color:#e2b65a">' + (es ? 'Recargar' : 'Reload') + '</a>'
        inner.appendChild(p)
      }, 20000)
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
